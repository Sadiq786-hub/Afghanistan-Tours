<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Afghanistan Tours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Afghanistan Tours logo">
      <span data-i18n="site_name">Afghanistan Tours</span>
    </a>

    <button class="lang-btn" id="langBtn">فارسی</button>

    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>

    <nav id="mainNav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="destinations.html" data-i18n="nav_destinations">Destinations</a>
      <a href="tours.html" data-i18n="nav_tours">Tours</a>
      <a href="about.html" data-i18n="nav_about">About</a>
      <a href="contact.html" class="active" data-i18n="nav_contact">Contact</a>
    </nav>
  </header>

  <section id="contact">
    <h2 data-i18n="contact_title">Contact Us</h2>
    <p data-i18n="contact_text">Ready to plan your trip? Send us a message.</p>

    <form class="contact-form">
      <input type="text" data-i18n-placeholder="form_name" placeholder="Your name">
      <input type="email" data-i18n-placeholder="form_email" placeholder="Your email">
      <select>
        <option data-i18n="form_choose">Choose a destination</option>
        <option data-i18n="kabul_name">Kabul</option>
        <option data-i18n="bamyan_name">Bamyan</option>
        <option data-i18n="herat_name">Herat</option>
      </select>
      <textarea rows="5" data-i18n-placeholder="form_message" placeholder="Your message"></textarea>
      <button type="submit" class="btn" data-i18n="form_send">Send Message</button>
    </form>
  </section>

  <footer>
    <p data-i18n="footer_contact">Phone: +93 770200192 | Email: info@afghanistantours.com</p>
    <p data-i18n="footer_rights">© 2026 Afghanistan Tours. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
